<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Med64 — Medical Examination Platform</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e4e9f0;--primary:#2563eb;--primary2:#1d4ed8;--danger:#dc2626;--ok:#059669;--warn:#d97706;--shadow:0 8px 28px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#111827;color:#fff;padding:18px 14px;position:fixed;inset:0 auto 0 0;z-index:10}.brand{font-size:23px;font-weight:800;padding:10px 12px 20px}.brand small{display:block;font-size:11px;color:#9ca3af;font-weight:500;margin-top:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d1d5db;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:#1f2937;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:700}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.primary:hover{background:var(--primary2)}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.btn.ok{color:#fff;background:var(--ok);border-color:var(--ok)}.btn:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:29px;font-weight:800;margin-top:5px}.section-title{margin:26px 0 12px;font-size:18px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px;color:var(--text)}.field textarea{min-height:130px;resize:vertical}.bar{height:9px;background:#e8edf4;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px}.progress-row{display:grid;grid-template-columns:180px 1fr 70px 80px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.progress-row:last-child{border-bottom:0}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;background:#eef2ff;color:#3730a3}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}.table th{color:var(--muted);font-size:12px}.hidden{display:none!important}.quiz{max-width:980px;margin:auto}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.timer{font-weight:900;color:var(--primary)}.question{font-size:21px;line-height:1.5;font-weight:700;margin:18px 0}.options{display:grid;gap:10px}.option{border:1px solid var(--line);background:#fff;border-radius:11px;padding:14px;text-align:left}.option:hover{border-color:#93c5fd}.option.selected{border-color:var(--primary);background:#eff6ff}.option.correct{border-color:#10b981;background:#ecfdf5}.option.wrong{border-color:#ef4444;background:#fef2f2}.review{margin-top:14px;padding:14px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}.review.good{border-left:4px solid var(--ok)}.review.bad{border-left:4px solid var(--danger)}.quiz-footer{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.notice{padding:11px 13px;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:13px}.notice.error{background:#fef2f2;color:#991b1b}.notice.ok{background:#ecfdf5;color:#065f46}.empty{text-align:center;padding:38px;color:var(--muted)}.category-card{padding:15px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px}.category-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.mini{font-size:12px;color:var(--muted)}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}@media(max-width:1000px){.stats,.filters{grid-template-columns:repeat(2,1fr)}.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}}@media(max-width:700px){.sidebar{position:static;width:100%;min-height:auto}.app{display:block}.main{margin:0;width:100%;padding:15px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{font-size:12px}.stats,.filters,.two,.three{grid-template-columns:1fr}.progress-row{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">Med64<small>Advanced Medical Examination Platform</small></div>
  <div class="nav">
    <button data-view="dashboard">Dashboard</button>
    <button data-view="exam">Start Exam</button>
    <button data-view="progress">Progress & Accuracy</button>
    <button data-view="mistakes">Mistakes</button>
    <button data-view="bank">Question Bank</button>
    <button data-view="import">Upload / Update Questions</button>
    <button data-view="settings">Settings</button>
  </div>
</aside>
<main class="main">
<div id="app"></div>
</main>
</div>
<script>
'use strict';

/* ============================================================
   Med64 GitHub Central Question Bank
   - No login
   - No Supabase
   - Questions come from /questions/index.json
   - Progress/mistakes are stored only in this browser
   ============================================================ */

const CONFIG = {
  manifest: './questions/index.json',
  cacheKey: 'med64_github_bank_v1',
  progressKey: 'med64_progress_v3',
  settingsKey: 'med64_settings_v3'
};

const DEFAULT_SETTINGS = {
  showAnswerImmediately: true,
  autoSubmit: true,
  shuffleQuestions: false,
  shuffleOptions: false
};

let bank = [];
let sourceFiles = [];
let progress = loadJSON(CONFIG.progressKey, {});
let settings = {...DEFAULT_SETTINGS, ...loadJSON(CONFIG.settingsKey, {})};
let exam = null;
let timerId = null;
let lastSync = null;

function loadJSON(key, fallback){
  try { const x = JSON.parse(localStorage.getItem(key)); return x ?? fallback; }
  catch(e){ return fallback; }
}
function saveState(){
  localStorage.setItem(CONFIG.progressKey, JSON.stringify(progress));
  localStorage.setItem(CONFIG.settingsKey, JSON.stringify(settings));
}
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function uid(q){ return String(q.id || '').trim(); }
function key(q){ return uid(q); }

function normalizeQuestion(q, source=''){
  const options = Array.isArray(q.options) ? q.options.map(x=>String(x)) : [];
  let ci = Number.isInteger(q.correctIndex) ? q.correctIndex : Number(q.correctIndex);
  if(!Number.isInteger(ci)) ci = -1;
  return {
    id: uid(q),
    section: String(q.section || q.category || 'General').trim() || 'General',
    category: String(q.category || 'General').trim() || 'General',
    question: String(q.question || '').trim(),
    options,
    correctIndex: ci,
    explanation: String(q.explanation || '').trim(),
    source: source || String(q.source || '')
  };
}
function validateQuestion(q, i){
  if(!q.id) return 'Missing id';
  if(!q.question) return 'Missing question';
  if(!Array.isArray(q.options) || q.options.length < 2) return 'At least 2 options required';
  if(!Number.isInteger(q.correctIndex) || q.correctIndex < 0 || q.correctIndex >= q.options.length) return 'Invalid correctIndex';
  if(!q.section) return 'Missing section';
  if(!q.category) return 'Missing category';
  return '';
}
function validateBank(list){
  const errors=[], seen=new Set();
  list.forEach((raw,i)=>{
    const q=normalizeQuestion(raw, raw.source);
    const err=validateQuestion(q,i);
    if(err) errors.push(`Question ${i+1} (${q.id||'no id'}): ${err}`);
    if(q.id && seen.has(q.id)) errors.push(`Duplicate question ID: ${q.id}`);
    if(q.id) seen.add(q.id);
  });
  return errors;
}

async function fetchJSON(url){
  const r = await fetch(url + (url.includes('?')?'&':'?') + 'v=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error(`HTTP ${r.status} while loading ${url}`);
  return await r.json();
}

async function loadFromGitHub(){
  const status = document.getElementById('syncStatus');
  if(status) status.textContent='Loading latest questions…';
  try{
    const manifest = await fetchJSON(CONFIG.manifest);
    let files = Array.isArray(manifest) ? manifest : manifest.files;
    if(!Array.isArray(files)) throw new Error('questions/index.json must contain a "files" array.');
    sourceFiles = files.map(x => typeof x === 'string' ? x : x.file).filter(Boolean);
    if(!sourceFiles.length) throw new Error('No question files are listed in questions/index.json.');

    const all=[];
    for(const file of sourceFiles){
      const data=await fetchJSON('./questions/'+file);
      const list=Array.isArray(data) ? data : data.questions;
      if(!Array.isArray(list)) throw new Error(`${file} must contain an array or { "questions": [...] }`);
      list.forEach(q=>all.push(normalizeQuestion(q,file)));
    }
    const errors=validateBank(all);
    if(errors.length) throw new Error(errors.slice(0,8).join('\\n'));
    bank=all;
    localStorage.setItem(CONFIG.cacheKey, JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
    lastSync=new Date();
    render();
    toast(`Loaded ${bank.length} questions from GitHub.`, 'ok');
  }catch(e){
    const cached=loadJSON(CONFIG.cacheKey,null);
    if(cached && Array.isArray(cached.bank)){
      bank=cached.bank;
      sourceFiles=cached.sourceFiles||[];
      lastSync=cached.updatedAt ? new Date(cached.updatedAt) : null;
      render();
      toast(`GitHub update failed. Using last saved bank. ${e.message}`, 'error');
    }else{
      bank=[];
      render();
      toast(`Could not load questions: ${e.message}`, 'error');
    }
  }
}

function getSections(){ return [...new Set(bank.map(q=>q.section))].sort((a,b)=>a.localeCompare(b)); }
function getCategories(section=''){
  return [...new Set(bank.filter(q=>!section||q.section===section).map(q=>q.category))].sort((a,b)=>a.localeCompare(b));
}
function pct(a,b){ return b ? Math.round((a/b)*100) : 0; }
function practicedCount(list){ return list.filter(q=>progress[key(q)] && progress[key(q)].attempts>0).length; }
function accuracyFor(list){
  let attempts=0, correct=0;
  list.forEach(q=>{
    const p=progress[key(q)];
    if(p){attempts+=p.attempts||0;correct+=p.correct||0;}
  });
  return pct(correct,attempts);
}
function progressFor(list){ return pct(practicedCount(list), list.length); }

function toast(text,type=''){
  const el=document.getElementById('toast');
  if(!el)return;
  el.className='notice '+(type||'');
  el.textContent=text;
  el.classList.remove('hidden');
  clearTimeout(window._toast);
  window._toast=setTimeout(()=>el.classList.add('hidden'),5000);
}

function layout(title,subtitle,body,actions=''){
  return `<div class="top"><div><h1>${esc(title)}</h1><div class="sub">${esc(subtitle||'')}</div></div><div class="actions">${actions}</div></div>
  <div id="toast" class="notice hidden"></div>${body}`;
}

function render(){
  const view=location.hash.replace('#','')||'dashboard';
  const allowed=['dashboard','exam','progress','mistakes','bank','import','settings','results'];
  const v=allowed.includes(view)?view:'dashboard';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  if(v==='dashboard') renderDashboard();
  else if(v==='exam') renderExamSetup();
  else if(v==='progress') renderProgress();
  else if(v==='mistakes') renderMistakes();
  else if(v==='bank') renderBank();
  else if(v==='import') renderImport();
  else if(v==='settings') renderSettings();
  else renderResults();
}
function go(v){ location.hash=v; render(); }

document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
window.addEventListener('hashchange',render);

function renderDashboard(){
  const sections=getSections();
  const body=`
  <div class="grid stats">
    <div class="card stat"><div class="label">Questions available</div><div class="value">${bank.length}</div></div>
    <div class="card stat"><div class="label">Questions practiced</div><div class="value">${practicedCount(bank)}</div></div>
    <div class="card stat"><div class="label">Overall progress</div><div class="value">${progressFor(bank)}%</div></div>
    <div class="card stat"><div class="label">Overall accuracy</div><div class="value">${accuracyFor(bank)}%</div></div>
  </div>
  <h2 class="section-title">Sections</h2>
  <div class="grid three">${sections.map(s=>{
    const list=bank.filter(q=>q.section===s);
    return `<div class="card"><div class="category-head"><strong>${esc(s)}</strong><span class="pill">${list.length} Q</span></div>
    <div class="mini" style="margin:10px 0">Progress ${progressFor(list)}% · Accuracy ${accuracyFor(list)}%</div>
    <div class="bar"><i style="width:${progressFor(list)}%"></i></div>
    <div class="mini" style="margin-top:8px">${practicedCount(list)} of ${list.length} practiced</div></div>`;
  }).join('') || '<div class="card empty">No questions loaded yet.</div>'}</div>
  <h2 class="section-title">GitHub question bank</h2>
  <div class="card">
    <div id="syncStatus">Source: <b>questions/index.json</b>${lastSync?` · Last successful sync: ${lastSync.toLocaleString()}`:''}</div>
    <div class="actions" style="margin-top:12px"><button class="btn primary" onclick="loadFromGitHub()">Refresh from GitHub</button><button class="btn" onclick="go('import')">Upload / Update Questions</button><button class="btn" onclick="go('exam')">Start an Exam</button></div>
  </div>`;
  document.getElementById('app').innerHTML=layout('Dashboard','Your personal progress is stored in this browser.',body);
}

function renderExamSetup(){
  const sections=getSections();
  const body=`
  <div class="card">
    <div class="filters">
      <div class="field"><label>Section</label><select id="examSection" onchange="updateExamCategories()"><option value="">All sections</option>${sections.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>
      <div class="field"><label>Category</label><select id="examCategory"><option value="">All categories</option>${getCategories().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label>Number of questions</label><input id="examCount" type="number" min="1" value="${Math.min(20,bank.length||1)}"></div>
      <div class="field"><label>Time limit (minutes, 0 = unlimited)</label><input id="examMinutes" type="number" min="0" value="0"></div>
      <div class="field"><label>Answer display</label><select id="answerMode">
        <option value="immediate" ${settings.showAnswerImmediately?'selected':''}>Show answer immediately after selection</option>
        <option value="finish" ${!settings.showAnswerImmediately?'selected':''}>Show answers after finishing</option>
      </select></div>
    </div>
    <div style="margin-top:14px" class="actions">
      <button class="btn primary" onclick="startExam()">Start Exam</button>
      <button class="btn" onclick="go('mistakes')">Practice Mistakes</button>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <strong>Exam behavior</strong>
    <p class="mini">Questions are loaded from the current GitHub bank. Each question accepts exactly one selected answer. Choose whether the correct answer is revealed immediately after selection or only after the exam is finished. Your section/category progress and accuracy update when the exam is submitted.</p>
  </div>`;
  document.getElementById('app').innerHTML=layout('Start Exam','Choose exactly what you want to practice.',body);
}
function updateExamCategories(){
  const s=document.getElementById('examSection').value;
  document.getElementById('examCategory').innerHTML='<option value="">All categories</option>'+getCategories(s).map(c=>`<option>${esc(c)}</option>`).join('');
}
function startExam(customList=null){
  if(!bank.length){toast('No questions are loaded. Refresh from GitHub first.','error');return;}
  let list=customList||[...bank];
  let answerMode=settings.showAnswerImmediately?'immediate':'finish';
  if(!customList){
    const s=document.getElementById('examSection').value,c=document.getElementById('examCategory').value,n=Math.max(1,Number(document.getElementById('examCount').value)||1);
    answerMode=document.getElementById('answerMode').value;
    list=list.filter(q=>(!s||q.section===s)&&(!c||q.category===c));
    if(!list.length){toast('No questions match those filters.','error');return;}
    if(settings.shuffleQuestions) shuffle(list);
    list=list.slice(0,Math.min(n,list.length));
  }
  exam={list,index:0,answers:{},started:Date.now(),minutes:customList?0:(Number(document.getElementById('examMinutes').value)||0),answerMode,submitted:false};
  if(exam.minutes>0) startTimer(exam.minutes*60);
  renderQuiz();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startTimer(sec){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!exam)return clearInterval(timerId);
    const left=Math.max(0,sec-Math.floor((Date.now()-exam.started)/1000));
    const t=document.getElementById('timer');if(t)t.textContent=formatTime(left);
    if(left<=0){clearInterval(timerId);submitExam(true);}
  },250);
}
function formatTime(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

function renderQuiz(){
  if(!exam)return go('exam');
  const q=exam.list[exam.index], selected=exam.answers[q.id];
  const opts=q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="chooseAnswer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('');
  const remaining=exam.minutes?Math.max(0,exam.minutes*60-Math.floor((Date.now()-exam.started)/1000)):0;
  const body=`<div class="quiz"><div class="card">
    <div class="qhead"><span class="pill">${exam.index+1} / ${exam.list.length}</span><span class="mini">${esc(q.section)} · ${esc(q.category)}</span>${exam.minutes?`<span class="timer" id="timer">${formatTime(remaining)}</span>`:''}</div>
    <div class="bar"><i style="width:${pct(exam.index,exam.list.length-1)}%"></i></div>
    <div class="question">${esc(q.question)}</div>
    <div class="options">${opts}</div>
    <div class="quiz-footer"><button class="btn" onclick="prevQ()" ${exam.index===0?'disabled':''}>Previous</button>
    <button class="btn primary" onclick="${exam.index===exam.list.length-1?'submitExam(false)':'nextQ()'}">${exam.index===exam.list.length-1?'Submit Exam':'Next'}</button></div>
  </div></div>`;
  document.getElementById('app').innerHTML=layout('Exam','Answer the question and continue.',body);
}
function chooseAnswer(i){
  if(!exam||exam.submitted)return;
  const q=exam.list[exam.index];
  if(exam.answerMode==='immediate' && exam.answers[q.id]!==undefined)return;

  // Exactly one answer is stored. A new selection replaces the previous one.
  exam.answers[q.id]=i;

  const buttons=document.querySelectorAll('.option');
  buttons.forEach((b,j)=>b.classList.toggle('selected',j===i));

  if(exam.answerMode==='immediate'){
    buttons.forEach((b,j)=>{
      b.disabled=true;
      if(j===q.correctIndex)b.classList.add('correct');
      if(j===i&&i!==q.correctIndex)b.classList.add('wrong');
    });
    const box=document.createElement('div');
    box.className='review '+(i===q.correctIndex?'good':'bad');
    box.innerHTML=`<b>${i===q.correctIndex?'Correct':'Incorrect'}</b><br>Correct answer: <b>${esc(q.options[q.correctIndex])}</b><br>${esc(q.explanation||'No explanation provided.')}`;
    document.querySelector('.options').after(box);
  }
}
function nextQ(){if(exam.index<exam.list.length-1){exam.index++;renderQuiz();}}
function prevQ(){if(exam.index>0){exam.index--;renderQuiz();}}
function submitExam(auto){
  if(!exam)return;
  if(!auto && !confirm('Submit this exam now?'))return;
  clearInterval(timerId);
  let correct=0;
  exam.list.forEach(q=>{
    const a=exam.answers[q.id];
    if(a===undefined)return;
    const k=key(q);
    if(!progress[k])progress[k]={attempts:0,correct:0,wrong:0,last:null};
    progress[k].attempts++;
    if(a===q.correctIndex){progress[k].correct++;correct++;progress[k].last='correct';}
    else {progress[k].wrong++;progress[k].last='wrong';}
  });
  saveState();
  const unanswered=exam.list.filter(q=>exam.answers[q.id]===undefined).length;
  const result={total:exam.list.length,answered:exam.list.length-unanswered,correct,unanswered,accuracy:pct(correct,exam.list.length-unanswered),list:exam.list,answers:exam.answers,auto};
  exam=null;
  sessionStorage.setItem('med64_last_result',JSON.stringify(result));
  go('results');
}
function renderResults(){
  const r=loadJSON('med64_last_result',null);
  if(!r){go('dashboard');return;}
  const rows=r.list.map((q,i)=>{
    const a=r.answers[q.id], ok=a===q.correctIndex;
    return `<div class="category-card"><div><b>${i+1}. ${esc(q.question)}</b></div><div class="mini" style="margin-top:6px">${esc(q.section)} · ${esc(q.category)}</div>
    <div class="review ${ok?'good':'bad'}">${a===undefined?'Unanswered':ok?'Correct':'Incorrect'} · Your answer: ${a===undefined?'—':esc(q.options[a])}<br>Correct answer: <b>${esc(q.options[q.correctIndex])}</b><br>${esc(q.explanation||'')}</div></div>`;
  }).join('');
  const body=`<div class="grid stats"><div class="card stat"><div class="label">Score</div><div class="value">${r.correct}/${r.total}</div></div><div class="card stat"><div class="label">Accuracy</div><div class="value">${r.accuracy}%</div></div><div class="card stat"><div class="label">Answered</div><div class="value">${r.answered}</div></div><div class="card stat"><div class="label">Unanswered</div><div class="value">${r.unanswered}</div></div></div>
  <h2 class="section-title">Full review</h2><div>${rows}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="go('exam')">New Exam</button><button class="btn" onclick="go('progress')">View Progress</button></div>`;
  document.getElementById('app').innerHTML=layout('Exam Results',r.auto?'Time expired — exam submitted automatically.':'Exam completed.',body);
}

function renderProgress(){
  const sections=getSections();
  const sectionRows=sections.map(s=>{
    const list=bank.filter(q=>q.section===s);
    const cats=getCategories(s);
    return `<div class="card" style="margin-bottom:12px"><div class="category-head"><h3 style="margin:0">${esc(s)}</h3><span class="pill">${list.length} questions</span></div>
    <div class="mini" style="margin:8px 0">Overall: ${progressFor(list)}% progress · ${accuracyFor(list)}% accuracy · ${practicedCount(list)} practiced</div>
    <div class="bar"><i style="width:${progressFor(list)}%"></i></div>
    <div style="margin-top:12px">${cats.map(c=>{
      const cl=list.filter(q=>q.category===c);
      return `<div class="progress-row"><strong>${esc(c)}</strong><div class="bar"><i style="width:${progressFor(cl)}%"></i></div><span>${progressFor(cl)}%</span><span>${accuracyFor(cl)}% acc.</span></div>`;
    }).join('')}</div></div>`;
  }).join('');
  const body=`<div class="grid stats"><div class="card stat"><div class="label">Overall progress</div><div class="value">${progressFor(bank)}%</div></div><div class="card stat"><div class="label">Overall accuracy</div><div class="value">${accuracyFor(bank)}%</div></div><div class="card stat"><div class="label">Practiced</div><div class="value">${practicedCount(bank)}</div></div><div class="card stat"><div class="label">Available</div><div class="value">${bank.length}</div></div></div>
  <h2 class="section-title">Section → Category performance</h2>${sectionRows||'<div class="card empty">No questions loaded.</div>'}
  <div class="card"><button class="btn danger" onclick="resetProgress()">Reset my progress</button><span class="mini" style="margin-left:10px">This affects only this browser.</span></div>`;
  document.getElementById('app').innerHTML=layout('Progress & Accuracy','Every section and category is calculated from your completed answers.',body);
}
function resetProgress(){if(confirm('Reset all progress, accuracy and mistakes on this browser?')){progress={};saveState();render();toast('Progress reset.','ok');}}

function renderMistakes(){
  const wrong=bank.filter(q=>progress[key(q)]&&progress[key(q)].wrong>0);
  const body=`<div class="card"><div class="category-head"><strong>${wrong.length} questions in your mistakes bank</strong><span class="mini">Wrong answers are retained locally.</span></div>
  ${wrong.length?`<div style="margin-top:14px">${wrong.map(q=>`<div class="category-card"><div class="category-head"><b>${esc(q.question)}</b><span class="pill">${progress[key(q)].wrong} wrong</span></div><div class="mini">${esc(q.section)} · ${esc(q.category)} · Correct: ${esc(q.options[q.correctIndex])}</div></div>`).join('')}</div>
  <div class="actions" style="margin-top:12px"><button class="btn primary" onclick="startExam(bank.filter(q=>progress[key(q)]&&progress[key(q)].wrong>0))">Practice Mistakes</button></div>`:'<div class="empty">No mistakes yet. Great work.</div>'}</div>`;
  document.getElementById('app').innerHTML=layout('Mistakes','Questions you answered incorrectly at least once.',body);
}

function renderBank(){
  const sections=getSections();
  const body=`<div class="card"><div class="filters"><div class="field"><label>Search</label><input id="bankSearch" oninput="filterBank()" placeholder="Search question, ID or category"></div><div class="field"><label>Section</label><select id="bankSection" onchange="filterBank()"><option value="">All</option>${sections.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Category</label><select id="bankCategory" onchange="filterBank()"><option value="">All</option>${getCategories().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Source</label><select id="bankSource" onchange="filterBank()"><option value="">All files</option>${sourceFiles.map(f=>`<option>${esc(f)}</option>`).join('')}</select></div></div></div>
  <div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Section</th><th>Category</th><th>Question</th><th>Progress</th></tr></thead><tbody id="bankRows"></tbody></table></div></div>`;
  document.getElementById('app').innerHTML=layout('Question Bank','Read-only view of the questions currently loaded from GitHub.',body);
  filterBank();
}
function filterBank(){
  const s=(document.getElementById('bankSearch')?.value||'').toLowerCase(),sec=document.getElementById('bankSection')?.value||'',cat=document.getElementById('bankCategory')?.value||'',src=document.getElementById('bankSource')?.value||'';
  const list=bank.filter(q=>(!s||[q.id,q.question,q.category,q.section].join(' ').toLowerCase().includes(s))&&(!sec||q.section===sec)&&(!cat||q.category===cat)&&(!src||q.source===src));
  const rows=document.getElementById('bankRows');if(!rows)return;
  rows.innerHTML=list.slice(0,500).map(q=>`<tr><td><b>${esc(q.id)}</b></td><td>${esc(q.section)}</td><td>${esc(q.category)}</td><td>${esc(q.question)}</td><td>${progressFor([q])}% · ${accuracyFor([q])}% acc.</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No matching questions.</td></tr>';
}

function renderImport(){
  const body=`<div class="grid two"><div class="card"><h3 style="margin-top:0">Upload a JSON file</h3><div class="field"><label>Choose JSON</label><input id="jsonFile" type="file" accept=".json,application/json"></div><div class="mini" style="margin-top:8px">Use this to test a new question bank in your browser. It does not change GitHub automatically.</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="previewUploaded()">Preview</button></div></div>
  <div class="card"><h3 style="margin-top:0">Paste JSON</h3><div class="field"><textarea id="jsonText" placeholder='[{"id":"pharma-001","section":"Pharmacology","category":"Autonomic","question":"...","options":["A","B","C","D"],"correctIndex":1,"explanation":"..."}]'></textarea></div><div class="actions"><button class="btn primary" onclick="previewPasted()">Preview</button><button class="btn" onclick="downloadTemplate()">Download template</button></div></div></div>
  <div id="importPreview" class="card" style="margin-top:16px"><div class="empty">Preview your JSON here before replacing the browser's current bank.</div></div>
  <div class="card" style="margin-top:16px"><h3 style="margin-top:0">How to update everyone</h3><ol><li>Edit or upload your JSON file into the repository's <b>questions/</b> folder on GitHub.</li><li>Make sure <b>questions/index.json</b> lists the filename.</li><li>Commit the change.</li><li>Users click <b>Refresh from GitHub</b>; Vercel will also serve the updated files after deployment/CDN refresh.</li></ol><div class="notice">This website intentionally does not contain a GitHub access token. A browser-side GitHub token would expose your repository credentials.</div></div>`;
  document.getElementById('app').innerHTML=layout('Upload / Update Questions','Easy JSON testing plus safe GitHub-based updates for everyone.',body);
}
async function previewUploaded(){
  const f=document.getElementById('jsonFile').files[0];if(!f){toast('Choose a JSON file first.','error');return}
  try{const text=await f.text();showImportPreview(JSON.parse(text));}catch(e){toast('Invalid JSON: '+e.message,'error');}
}
function previewPasted(){try{showImportPreview(JSON.parse(document.getElementById('jsonText').value));}catch(e){toast('Invalid JSON: '+e.message,'error');}}
function showImportPreview(data){
  const list=Array.isArray(data)?data:data.questions;
  if(!Array.isArray(list)){toast('JSON must be an array or { "questions": [...] }.','error');return}
  const errors=validateBank(list);
  const normalized=list.map(q=>normalizeQuestion(q));
  document.getElementById('importPreview').innerHTML=`<h3 style="margin-top:0">Preview: ${normalized.length} questions</h3>${errors.length?`<div class="notice error">${esc(errors.slice(0,15).join('\\n'))}</div>`:'<div class="notice ok">Validation passed.</div>'}<div class="mini" style="margin:12px 0">First 10 questions:</div><div>${normalized.slice(0,10).map(q=>`<div class="category-card"><b>${esc(q.id)}</b> · ${esc(q.section)} · ${esc(q.category)}<br>${esc(q.question)}</div>`).join('')}</div>${!errors.length?`<button class="btn primary" onclick='usePreviewBank(${JSON.stringify(normalized).replace(/</g,"\\u003c")})'>Use this bank in this browser</button>`:''}`;
}
function usePreviewBank(list){
  const errors=validateBank(list);if(errors.length){toast('Cannot use invalid bank.','error');return}
  bank=list;sourceFiles=['local preview'];lastSync=new Date();render();toast(`Loaded ${bank.length} preview questions in this browser. GitHub was not changed.`,'ok');
}
function downloadTemplate(){
  const sample=[{id:"pharma-001",section:"Pharmacology",category:"Autonomic Drugs",question:"Which receptor is primarily activated by norepinephrine?",options:["Alpha-1","Beta-2","M2","Nicotinic"],correctIndex:0,explanation:"Norepinephrine strongly activates alpha-1 receptors."}];
  downloadBlob(JSON.stringify(sample,null,2),'questions-template.json','application/json');
}
function downloadBlob(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

function renderSettings(){
  const body=`<div class="card"><h3 style="margin-top:0">Exam settings</h3>
  <label><input type="checkbox" id="sImmediate" ${settings.showAnswerImmediately?'checked':''}> Use “Show answer immediately” as the default exam mode</label><br><br>
  <label><input type="checkbox" id="sAuto" ${settings.autoSubmit?'checked':''}> Auto-submit when timer reaches zero</label><br><br>
  <label><input type="checkbox" id="sShuffleQ" ${settings.shuffleQuestions?'checked':''}> Shuffle questions when starting an exam</label><br><br>
  <label><input type="checkbox" id="sShuffleO" ${settings.shuffleOptions?'checked':''}> Shuffle options (disabled by default)</label>
  <div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveSettings()">Save settings</button><button class="btn" onclick="exportProgress()">Export my progress</button><button class="btn" onclick="exportBank()">Export current bank</button></div></div>
  <div class="card" style="margin-top:16px"><h3 style="margin-top:0">About storage</h3><p class="mini">The question bank comes from GitHub. Your progress, accuracy and mistakes are stored only in this browser using localStorage. No account or external database is used.</p></div>`;
  document.getElementById('app').innerHTML=layout('Settings','Personal browser settings and backups.',body);
}
function saveSettings(){
  settings.showAnswerImmediately=document.getElementById('sImmediate').checked;
  settings.autoSubmit=document.getElementById('sAuto').checked;
  settings.shuffleQuestions=document.getElementById('sShuffleQ').checked;
  settings.shuffleOptions=document.getElementById('sShuffleO').checked;
  saveState();toast('Settings saved.','ok');
}
function exportProgress(){downloadBlob(JSON.stringify({exportedAt:new Date().toISOString(),progress},null,2),'med64-progress.json','application/json');}
function exportBank(){downloadBlob(JSON.stringify(bank,null,2),'med64-current-question-bank.json','application/json');}

document.addEventListener('DOMContentLoaded',()=>{
  render();
  loadFromGitHub();
});
</script>
</body>
</html>
